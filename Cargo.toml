[package]
name = "blog-tracker-tui"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A local terminal tracker for RSS and web-only blogs"
readme = "README.md"
repository = "https://github.com/worldlightyjx/blog-tracker-tui"
homepage = "https://github.com/worldlightyjx/blog-tracker-tui"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
feed-rs = "2.4"
ratatui = "0.30.2"
regex = "1"
reqwest = { version = "0.13.5", features = ["blocking"] }
rusqlite = { version = "0.41", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
url = "2.5"
webbrowser = "1.2"

[dev-dependencies]
tempfile = "3"
